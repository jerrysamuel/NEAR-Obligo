[package]
name = "obligo-permissions"
version = "0.1.0"
authors = ["Obligo Team <team@obligo.ai>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.1.0", features = ["legacy"] }
borsh = { version = "1.5.7", features = ["unstable__schema"] }
schemars = "0.8.22"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
